[package]
name = "bannerify"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "wrap_help"] }
colored = "3.1.1"
flate2 = "1.1.5"
image = "0.25.10"
rayon = "1.12.0"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[features]
force-scalar = []
