# This is the default config for bannerify
# Read readme for more details on the options
#
# Every key here is optional, and any value given on the command line wins over
# the value in this file.
#
# Every key below is live as of phase 3.

# default is blank, put a number if you want to limit the workers
# keeping it blank is the most performance option
# workers =

# * Backend Options *

# solver backend: "auto" (default), "gpu" or "cpu"
# gpu solves on the GPU and fails with exit code 6 when none can be used; cpu
# solves on the processor; auto uses the GPU when one can be used and the CPU
# otherwise
# backend = "auto"

# GPU memory budget for the solver's buffers, in MiB (default 2048)
# work that does not fit is split into more batches; only the GPU backend
# uses it, and too small a value for the other settings is an error
# gpu_memory = 2048

# * Output Options *

# output format: "html" (default), "schem", "litematic", or "json"
# schematic and json formats write directly to the output path without HTML
# format = "html"

# largest dimension of the preview images embedded in the HTML export
# default is the banner wall's own size (no resize after the solve); either
# way it is never larger than the banner wall itself
# has no effect when the output format is schem, litematic or json
# preview = 1200

# also write the full-resolution banner wall to this PNG path
# it is NOT embedded in the HTML, whose preview is the downscaled one
# render = "wall.png"

# * Resizing Methods *
# exactly one of fit / stretch / fill may be set

# scales up the image until the canva is fully covered
# corners and edges of the image will be cut off
fit = true

# stretch the image until the canva is fully covered
# the aspect ratio of the image and the banners will not be the same
stretch = false

# fill the empty space with COLOR
# allowed formats: '#ff9453', 'rgb(114, 5, 14)', '9,4,87'
# fill = COLOR

# * Generation Options *

# patterns in the list will not be used
exclude_patterns = []

# blocks the background may be built from: block ids and block sets, applied
# left to right; a leading '-' removes a block or a set instead of adding it
# "default" is every block; `bannerify --list sets` prints the other sets
# e.g. ["default", "-falling", "-beacon"] or ["wools", "concretes"]
blocks = ["default"]

# MIN and MAX number of layers that a banner can have
# simpler image chunks will use less layers
layer_range = [4, 6]

# perturbation search: [TOP_N, DUPLICATES, ROUNDS]
# any zero disables it
# perturbations = [0, 0, 0]

# how hard the solver is pulled towards clean, flat dye colors
# every cell is also fitted by an idealised 2-layer banner drawn in pure dye
# colors, and this weighs that fit against the real pixels: 0 ignores it
# entirely, 1 weighs it as heavily as the target itself
# raise it if flat areas and logos come out muddy, lower it for photographs
# (A/B'd over 0/0.25/0.5/1.0: 0.5 cleans flat art decisively; 1.0 washes out
#  gradients, so prefer 0-0.25 for photographic targets)
feature_weight = 0.5

# how strongly the solver prefers pure dye colors over mixes of them
# every pixel is charged its distance to the nearest of the 16 dye colors,
# times this weight; 0 (the default) turns it off
# around 0.25 with feature_weight = 0 it cleans flat areas; from 0.5 up, a
# color between two dyes moves to one of them, which can be the wrong hue
# it penalizes photographic shades, so expect a higher error on photographs
purity_weight = 0

# removes pattern texture from areas the image shows as flat
# every pair of neighboring pixels whose difference does not match the
# image's difference is charged the mismatch, times this weight; 0 (the
# default) turns it off
# works best with feature_weight = 0: try 0.5 on logos and flags
# it does not sharpen edges, and above 1 a pattern edge a pixel away from the
# image's edge is charged enough that the banner may lose the edge
gradient_weight = 0

# per-banner shift: [X, Y]
# each banner may be solved against the image moved up to X pixels sideways
# and Y pixels up or down, whichever lets a clean banner fit best; [0, 0] (the
# default) turns it off. X can be at most 2 and Y at most 4
# [1, 1] straightens horizontal and vertical edges; larger ranges turn
# diagonals and curves into steps and take longer
# the banner is still drawn at its real position, and the reported error is
# measured against the unmoved image, so the reported error rises
shift_range = [0, 0]

# REMOVED in phase 5: `lab_refine`.
# The separate perceptual (OKLab) pass is gone; exact perceptual scoring now
# happens inside refinement, on every window step, and is tuned by
# `exact_candidates` below. Unknown keys are a hard error, so delete any
# `lab_refine = N` line you still have in your own config.

# * Refinement Options *

# number of pass that refinement can try
# setting this number above 3 will most likely do nothing
refinement_pass = 2

# number of layers that are 'adjusted' at once during refinement
# higher number will produce better result, but will take more time
# the sweet spot for this setting is 2 or 3
window_size = 2

# threshold for passing candidates
# setting it to 1.0 will only use the best candidate and
# 0.0 will use all the candidates
error_threshold = 0.7

# maximum number of candidate that can survive
# (this was misspelled 'refine_candidate' in the old build's config.toml;
#  the option has always been --refinement-candidate)
refinement_candidate = 5

# candidates per refinement window step that are scored EXACTLY, by perceptual
# (OKLab) distance on the fully composited banner, instead of by the cheap
# closed-form sRGB error -- the closed form then only shortlists
# 0 turns it off: much faster, noticeably worse
# 8 is the knee of the curve; above 20 the returns are tiny
exact_candidates = 20

# * Block Sets *

# your own block sets, usable by name in `blocks` above and in --blocks
# a set is written like `blocks`: ids and other sets, '-' to remove
# a set cannot take the name of a block or of a built-in set
# this table has to stay at the end of the file: in TOML every key below a
# [table] header belongs to that table
[block_sets]
# quiet = ["wools", "concretes", "-black_wool", "smooth_stone"]
