# This is the default config for bannerify
# Read readme for more details on the options
#
# Every key here is optional, and any value given on the command line wins over
# the value in this file.
#
# Every key below is live as of phase 3.

# default is blank, put a number if you want to limit the workers
# keeping it blank is the most performance option
# workers =

# * Output Options *

# largest dimension of the preview images embedded in the HTML export
# default is the input image's own size; either way it is never larger than
# the banner wall itself
# preview = 1200

# also write the full-resolution banner wall to this PNG path
# it is NOT embedded in the HTML, whose preview is the downscaled one
# render = "wall.png"

# * Resizing Methods *
# exactly one of fit / stretch / fill may be set

# scales up the image until the canva is fully covered
# corners and edges of the image will be cut off
fit = true

# stretch the image until the canva is fully covered
# the aspect ratio of the image and the banners will not be the same
stretch = false

# fill the empty space with COLOR
# allowed formats: '#ff9453', 'rgb(114, 5, 14)', '9,4,87'
# fill = COLOR

# * Generation Options *

# patterns in the list will not be used
exclude_patterns = []

# blocks in the list will not be used when generating background
exclude_blocks = []

# MIN and MAX number of layers that a banner can have
# simpler image chunks will use less layers
layer_range = [4, 6]

# perturbation search: [TOP_N, DUPLICATES, ROUNDS]
# any zero disables it
# perturbations = [0, 0, 0]

# how hard the solver is pulled towards clean, flat dye colors
# every cell is also fitted by an idealised 2-layer banner drawn in pure dye
# colors, and this weighs that fit against the real pixels: 0 ignores it
# entirely, 1 weighs it as heavily as the target itself
# raise it if flat areas and logos come out muddy, lower it for photographs
# (A/B'd over 0/0.25/0.5/1.0: 0.5 cleans flat art decisively; 1.0 washes out
#  gradients, so prefer 0-0.25 for photographic targets)
feature_weight = 0.5

# REMOVED in phase 5: `lab_refine`.
# The separate perceptual (OKLab) pass is gone; exact perceptual scoring now
# happens inside refinement, on every window step, and is tuned by
# `exact_candidates` below. Unknown keys are a hard error, so delete any
# `lab_refine = N` line you still have in your own config.

# * Refinement Options *

# number of pass that refinement can try
# setting this number above 3 will most likely do nothing
refinement_pass = 2

# number of layers that are 'adjusted' at once during refinement
# higher number will produce better result, but will take more time
# the sweet spot for this setting is 2 or 3
window_size = 2

# threshold for passing candidates
# setting it to 1.0 will only use the best candidate and
# 0.0 will use all the candidates
error_threshold = 0.7

# maximum number of candidate that can survive
# (this was misspelled 'refine_candidate' in the old build's config.toml;
#  the option has always been --refinement-candidate)
refinement_candidate = 5

# candidates per refinement window step that are scored EXACTLY, by perceptual
# (OKLab) distance on the fully composited banner, instead of by the cheap
# closed-form sRGB error -- the closed form then only shortlists
# 0 turns it off: much faster, noticeably worse
# 8 is the knee of the curve; above 20 the returns are tiny
exact_candidates = 20
